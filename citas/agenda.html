<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#0E0E0D">
<title>Mi agenda · D Espacios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="citas.css">
</head>
<body>
<div id="app" class="app wide"><noscript><p class="noscript">Necesitas activar JavaScript.</p></noscript></div>
<script src="config.js"></script>
<script src="citas.js"></script>
<script>
(function () {
  'use strict';
  const { h, api, copiar, editorHorario } = Citas;
  const app = document.getElementById('app');
  const q = new URLSearchParams(location.search);
  const proId = (q.get('p') || '').trim(), resetTok = (q.get('reset') || '').trim();
  const S = { sesion: '', perfil: null, tab: 'hoy', semana: null, dia: null, vent: null, tabScroll: 0 };
  const MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  const DIA = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
  try { S.sesion = sessionStorage.getItem('ses_' + proId) || ''; } catch (e) { S.sesion = ''; }
  const guardar = function (v) { S.sesion = v; try { v ? sessionStorage.setItem('ses_' + proId, v) : sessionStorage.removeItem('ses_' + proId); } catch (e) { /* sin storage */ } };

  /* ---------- fechas (string 'yyyy-mm-dd', sin zona del dispositivo) ---------- */
  const U = function (f) { const p = f.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); };
  const F = function (d) { return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0'); };
  const sumar = function (f, n) { const d = U(f); d.setUTCDate(d.getUTCDate() + n); return F(d); };
  const lunesDe = function (f) { return sumar(f, -((U(f).getUTCDay() + 6) % 7)); };
  const corta = function (f) { const d = U(f); return DIA[d.getUTCDay()].slice(0, 3) + ' ' + d.getUTCDate() + ' ' + MES[d.getUTCMonth()]; };
  const larga = function (f) { const d = U(f); return DIA[d.getUTCDay()] + ' ' + d.getUTCDate() + ' de ' + MES[d.getUTCMonth()]; };

  function marco(contenido, conSalir, nombre) {
    app.classList.toggle('con-tabs', !!conSalir);
    app.replaceChildren(
      h('div', { class: 'top' }, h('div', { class: 'top-bar' }, h('span', { class: 'brand' }, 'D ESPACIOS' + (nombre ? ' · ' + nombre.toUpperCase() : '')),
        conSalir ? h('button', { type: 'button', class: 'top-link', onclick: function () { guardar(''); S.perfil = null; login(); } }, 'Salir') : null)),
      contenido);
    window.scrollTo(0, 0);
  }
  const cuerpo = function () { const b = h('div', { class: 'body', style: 'gap:16px' }); for (let i = 0; i < arguments.length; i++) if (arguments[i]) b.appendChild(arguments[i]); return b; };
  const err = function (m) { return h('div', { class: 'err', role: 'alert' }, m); };

  async function llamar(accion, datos) {
    try { return await api(accion, Object.assign({ sesion: S.sesion }, datos || {})); }
    catch (e) { if (e.codigo === 'sesion_expirada') { guardar(''); login('Tu sesión terminó. Entra de nuevo con tu PIN.'); } throw e; }
  }

  /* ---------- acceso ---------- */
  function login(aviso) {
    if (!proId) return marco(cuerpo(h('h1', { style: 'font-size:30px' }, 'Link incompleto'), err('Abre el link de tu agenda que te llegó por correo.')), false);
    const msg = h('div', { role: 'alert' }, aviso ? err(aviso) : null);
    const pin = h('input', { id: 'pin', type: 'password', inputmode: 'numeric', autocomplete: 'current-password', maxlength: '6' });
    const btn = h('button', { type: 'submit', class: 'btn' }, 'Entrar');
    const olv = h('button', { type: 'button', class: 'linkbtn', style: 'align-self:flex-start', onclick: async function () {
      olv.disabled = true;
      try { const r = await api('agendaOlvidePin', { profesionistaId: proId }); msg.replaceChildren(h('div', { class: 'ok' }, r.mensaje)); }
      catch (e) { msg.replaceChildren(err(e.message)); }
      olv.disabled = false;
    } }, 'Olvidé mi PIN');
    marco(h('form', { novalidate: true, style: 'display:contents', onsubmit: async function (ev) {
      ev.preventDefault();
      if (!/^\d{6}$/.test(pin.value)) { msg.replaceChildren(err('Tu PIN tiene 6 dígitos.')); return; }
      btn.disabled = true; msg.replaceChildren();
      try { const r = await api('agendaEntrar', { profesionistaId: proId, pin: pin.value }); guardar(r.sesion); iniciar(); }
      catch (e) { btn.disabled = false; pin.value = ''; msg.replaceChildren(err(e.message)); }
    } },
      cuerpo(h('h1', { style: 'font-size:32px' }, 'Mi agenda'), h('div', { class: 'field' }, h('label', { for: 'pin' }, 'PIN de 6 dígitos'), pin), olv, msg),
      h('div', { class: 'dock' }, btn)), false);
    pin.focus();
  }

  function vistaReset() {
    const n1 = h('input', { id: 'n1', type: 'password', inputmode: 'numeric', maxlength: '6', autocomplete: 'new-password' });
    const n2 = h('input', { id: 'n2', type: 'password', inputmode: 'numeric', maxlength: '6', autocomplete: 'new-password' });
    const msg = h('div', { role: 'alert' }); const btn = h('button', { type: 'submit', class: 'btn' }, 'Guardar PIN nuevo');
    marco(h('form', { novalidate: true, style: 'display:contents', onsubmit: async function (ev) {
      ev.preventDefault(); msg.replaceChildren();
      if (!/^\d{6}$/.test(n1.value)) { msg.appendChild(err('Tu PIN debe tener 6 dígitos.')); return; }
      if (n1.value !== n2.value) { msg.appendChild(err('Los dos PIN no coinciden.')); return; }
      btn.disabled = true;
      try { await api('agendaRestablecerPin', { profesionistaId: proId, token: resetTok, pinNuevo: n1.value }); history.replaceState(null, '', 'agenda.html?p=' + encodeURIComponent(proId)); login('PIN actualizado. Entra con tu PIN nuevo.'); }
      catch (e) { btn.disabled = false; msg.replaceChildren(err(e.message)); }
    } },
      cuerpo(h('h1', { style: 'font-size:32px' }, 'Crea tu PIN nuevo'),
        h('div', { class: 'field' }, h('label', { for: 'n1' }, 'PIN nuevo (6 dígitos)'), n1), h('div', { class: 'field' }, h('label', { for: 'n2' }, 'Repite el PIN'), n2), msg),
      h('div', { class: 'dock' }, btn)), false);
  }

  /* ---------- armazón con pestañas ---------- */
  const TABS = [['hoy', 'Hoy'], ['semana', 'Semana'], ['citas', 'Todas las citas'], ['clientes', 'Clientes'], ['bloqueos', 'Bloquear fechas'], ['horario', 'Mi horario'], ['cuenta', 'Cuenta']];
  let contenido;
  window.addEventListener('resize', function () { if (S.tab === 'semana' && S.reajusta) S.reajusta(); });
  async function iniciar() {
    marco(cuerpo(h('p', { class: 'spin', role: 'status' }, 'Cargando…')), true);
    try { S.perfil = await llamar('agendaPerfil'); } catch (e) { if (S.sesion) marco(cuerpo(err(e.message)), true); return; }
    S.semana = lunesDe(S.perfil.hoy); S.dia = S.perfil.hoy;
    armar();
  }
  function armar() {
    contenido = h('div', { class: 'body', style: 'gap:18px' });
    const tabs = h('div', { class: 'tabs', role: 'tablist' }, TABS.map(function (t) {
      return h('button', { type: 'button', class: 'tab', role: 'tab', 'aria-selected': S.tab === t[0] ? 'true' : 'false', onclick: function (ev) { if (S.sucio && S.tab === 'horario' && t[0] !== 'horario' && !confirm('Tienes cambios sin guardar en Mi horario. ¿Salir sin guardar?')) return; S.sucio = false; S.tabScroll = ev.currentTarget.parentNode.scrollLeft; S.tab = t[0]; armar(); } }, t[1]);
    }));
    marco(h('div', { style: 'display:contents' }, tabs, contenido), true, S.perfil.nombre);
    tabs.scrollLeft = S.tabScroll;
    const sel = tabs.querySelector('[aria-selected=true]');
    if (sel) { const a = sel.offsetLeft, b = a + sel.offsetWidth; if (a < tabs.scrollLeft || b > tabs.scrollLeft + tabs.clientWidth) tabs.scrollLeft = Math.max(0, a - 24); }
    window.scrollTo(0, 0); S.suave = false;
    ({ hoy: tabHoy, semana: tabSemana, citas: tabCitas, bloqueos: tabBloqueos, horario: tabHorario, clientes: tabClientes, cuenta: tabCuenta })[S.tab]();
  }
  const cargando = function () { if (S.suave) { S.suave = false; return; } contenido.replaceChildren(h('p', { class: 'spin', role: 'status' }, 'Cargando…')); };
  const TABFN = function () { return { hoy: tabHoy, semana: tabSemana, citas: tabCitas, bloqueos: tabBloqueos, horario: tabHorario, clientes: tabClientes, cuenta: tabCuenta }; };
  /* recarga sin borrar la pantalla: se ve lo anterior hasta que llegan los datos nuevos */
  const recargar = function () { S.vent = null; S.suave = true; TABFN()[S.tab](); };

  /* ---------- tarjeta de cita ---------- */
  function tarjeta(c) {
    const tel = c.cliente.telefono;
    const estados = { confirmada: ['Confirmada', ''], asistio: ['Asistió', ' asis'], no_asistio: ['No asistió', ' noas'], cancelada: ['Cancelada', ' mal'] };
    const et = estados[c.estado] || [c.estado, ''];
    const msg = h('div', { role: 'alert' });
    const act = h('div', { class: 'acciones' });
    const hacer = function (fn) { return async function (ev) { ev.target.disabled = true; msg.replaceChildren(); try { await fn(); recargar(); } catch (e) { ev.target.disabled = false; msg.replaceChildren(err(e.message)); } }; };
    if (tel) act.appendChild(h('a', { class: 'linkbtn', href: 'https://wa.me/52' + tel, target: '_blank', rel: 'noopener noreferrer' }, 'WhatsApp'));
    if (c.link) act.appendChild(h('button', { type: 'button', class: 'linkbtn', onclick: async function (ev) { ev.target.textContent = (await copiar(c.link)) ? 'Link copiado' : 'No se pudo copiar'; } }, 'Copiar link de la cita'));
    if (c.estado === 'confirmada' && c.inicioPasado) {
      act.appendChild(h('button', { type: 'button', class: 'linkbtn', onclick: hacer(function () { return llamar('agendaMarcar', { citaId: c.id, estado: 'asistio' }); }) }, 'Asistió'));
      act.appendChild(h('button', { type: 'button', class: 'linkbtn', style: 'color:var(--danger)', onclick: hacer(function () { return llamar('agendaMarcar', { citaId: c.id, estado: 'no_asistio' }); }) }, 'No asistió'));
    }
    if (c.estado === 'asistio' || c.estado === 'no_asistio') act.appendChild(h('button', { type: 'button', class: 'linkbtn', onclick: hacer(function () { return llamar('agendaMarcar', { citaId: c.id, estado: 'confirmada' }); }) }, 'Deshacer marca'));
    if (c.estado === 'confirmada' && !c.inicioPasado) {
      const cancelar = h('button', { type: 'button', class: 'linkbtn', style: 'color:var(--danger)', onclick: function () {
        cancelar.replaceWith(h('span', { class: 'acciones' }, h('span', { class: 'note', style: 'align-self:center' }, 'Se avisa al cliente por correo, con disculpa e invitación a reservar de nuevo.'),
          h('button', { type: 'button', class: 'linkbtn', style: 'color:var(--danger)', onclick: hacer(function () { return llamar('agendaCancelar', { citaId: c.id }); }) }, 'Sí, cancelar'),
          h('button', { type: 'button', class: 'linkbtn', onclick: recargar }, 'No')));
      } }, 'Cancelar cita');
      act.appendChild(cancelar);
    }
    return h('div', { class: 'item' },
      h('div', { style: 'display:flex;justify-content:space-between;gap:8px;align-items:flex-start' }, h('span', { class: 'hora' }, c.hora + ' – ' + c.horaFin), h('span', { class: 'chip' + et[1] }, et[0])),
      h('b', null, c.cliente.nombre || 'Cliente'),
      h('span', { class: 'meta' }, [tel, c.cliente.correo].filter(Boolean).join(' · ')),
      c.motivo ? h('span', { class: 'meta' }, 'Motivo: ' + c.motivo) : null, act, msg);
  }
  const chipBloqueo = function (b) { return h('div', { class: 'item', style: 'background:#F3F1EB' }, h('span', { class: 'chip bq' }, 'Bloqueado'), h('span', { class: 'meta' }, (b.diaCompleto ? 'Todo el día' : b.horaIni + ' – ' + b.horaFin) + (b.motivo ? ' · ' + b.motivo : ''))); };

  /* Ventana de citas en memoria (±31 días): navegar días/semanas no vuelve a pedir datos al servidor. */
  const ventanaActual = function () { return S.vent && S.vent.t > Date.now() - 90000 ? S.vent : null; };
  async function datos(desde, hasta) {
    const P = S.perfil;
    let v = ventanaActual();
    if (!v) {
      const d0 = sumar(P.hoy, -31), d1 = sumar(P.hoy, 31);
      try { const r = await llamar('agendaCitas', { desde: d0, hasta: d1 }); v = S.vent = { desde: d0, hasta: d1, citas: r.citas, bloqueos: r.bloqueos, t: Date.now() }; }
      catch (e) { v = null; }
    }
    if (v && desde >= v.desde && hasta <= v.hasta) {
      return { citas: v.citas.filter(function (c) { return c.fecha >= desde && c.fecha <= hasta; }),
        bloqueos: v.bloqueos.filter(function (b) { return b.fechaIni <= hasta && (b.fechaFin > desde || (b.fechaFin === desde && b.horaFin !== '00:00')); }) };
    }
    return llamar('agendaCitas', { desde: desde, hasta: hasta });
  }
  const enCache = function () { return !!ventanaActual(); };

  /* ---------- utilidades de agenda ---------- */
  const DK = ['dom', 'lun', 'mar', 'mie', 'jue', 'vie', 'sab'];
  const aMin = function (t) { return (+t.slice(0, 2)) * 60 + (+t.slice(3, 5)); };
  const hhmm = function (m) { return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
  const bloquesDe = function (f) { return String(S.perfil.horario[DK[U(f).getUTCDay()]] || '').split(',').map(function (x) { return x.trim().split('-'); }).filter(function (x) { return x.length === 2 && x[0]; }); };
  const cubre = function (b, f, m) { const k = f + 'T' + hhmm(m); return b.fechaIni + 'T' + b.horaIni <= k && k < b.fechaFin + 'T' + b.horaFin; };
  const nombreCorto = function (c) { return c.cliente.nombre || 'Cliente'; };
  const mesAbre = function (f) { return f.slice(0, 7) + '-01'; };
  const finMes = function (f) { const d = U(f); return F(new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0))); };
  const MESL = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  const tituloDia = function (f) { const d = U(f); return DIA[d.getUTCDay()] + ' ' + d.getUTCDate() + ' de ' + MESL[d.getUTCMonth()]; };
  const flecha = function (lbl, dir, fn) { return h('button', { type: 'button', class: 'arrow-b', 'aria-label': lbl, onclick: fn }, Citas.svg(dir < 0 ? 'M15 5l-7 7 7 7' : 'M9 5l7 7-7 7', 20, '#0E0E0D')); };

  /* Tarjeta oscura de una cita (Hoy, búsqueda y Todas las citas) */
  function filaCita(c, etiquetaFecha) {
    const tel = c.cliente.telefono;
    const msg = h('div', { role: 'alert' });
    const hacer = function (fn) { return async function (ev) { ev.target.disabled = true; msg.replaceChildren(); try { await fn(); recargar(); } catch (e) { ev.target.disabled = false; msg.replaceChildren(err(e.message)); } }; };
    const btn = function (t, cls, fn) { return h('button', { type: 'button', class: 'cb ' + (cls || ''), onclick: fn }, t); };
    const acc = h('div', { class: 'cb-row' });
    const futura = c.estado === 'confirmada' && !c.inicioPasado;
    if (futura && c.link) {
      const texto = 'Hola ' + nombreCorto(c) + ', te comparto el link de tu cita del ' + corta(c.fecha) + ' a las ' + c.hora + ': ' + c.link;
      if (tel) acc.appendChild(h('a', { class: 'cb gold', href: 'https://wa.me/52' + tel + '?text=' + encodeURIComponent(texto), target: '_blank', rel: 'noopener noreferrer' }, 'WhatsApp con link'));
      acc.appendChild(btn('Copiar link', '', async function (ev) { ev.target.textContent = (await copiar(c.link)) ? 'Link copiado' : 'No se pudo copiar'; }));
      const can = btn('Cancelar', 'danger', function () {
        can.replaceWith(h('span', { class: 'cb-row' }, h('span', { class: 'cb-note' }, 'Se avisa al cliente por correo, con disculpa e invitación a reservar de nuevo.'), btn('Sí, cancelar', 'danger', hacer(function () { return llamar('agendaCancelar', { citaId: c.id }); })), btn('No', '', recargar)));
      });
      acc.appendChild(can);
    } else {
      if (tel) acc.appendChild(h('a', { class: 'cb', href: 'https://wa.me/52' + tel, target: '_blank', rel: 'noopener noreferrer' }, 'WhatsApp'));
      if (c.estado === 'confirmada' && c.inicioPasado) {
        acc.appendChild(btn('Asistió', 'gold', hacer(function () { return llamar('agendaMarcar', { citaId: c.id, estado: 'asistio' }); })));
        acc.appendChild(btn('No asistió', '', hacer(function () { return llamar('agendaMarcar', { citaId: c.id, estado: 'no_asistio' }); })));
      }
      if (c.estado === 'asistio' || c.estado === 'no_asistio') acc.appendChild(btn('Deshacer marca', '', hacer(function () { return llamar('agendaMarcar', { citaId: c.id, estado: 'confirmada' }); })));
    }
    const et = { asistio: 'Asistió', no_asistio: 'No asistió', cancelada: 'Cancelada' }[c.estado] || '';
    return h('div', { class: 'cita-oscura' },
      h('div', { class: 'ci-info' },
        h('span', { class: 'ci-nom' }, (etiquetaFecha ? corta(c.fecha) + ' · ' + c.hora + ' · ' : '') + nombreCorto(c) + (et ? ' · ' + et : '')),
        h('span', { class: 'ci-det' }, [c.motivo || 'Cita', tel, c.cliente.correo].filter(Boolean).join(' · '))),
      acc, msg);
  }

  /* ---------- Hoy: línea de tiempo del día ---------- */
  async function tabHoy() {
    if (!enCache()) cargando();
    const P = S.perfil, f = S.dia;
    let r, pas = { citas: [] }, mes = { citas: [] };
    try {
      const res = await Promise.all([
        datos(f, f),
        datos(sumar(P.hoy, -14), sumar(P.hoy, -1)).catch(function () { return { citas: [] }; }),
        datos(mesAbre(P.hoy), finMes(P.hoy)).catch(function () { return { citas: [] }; })]);
      r = res[0]; pas = res[1]; mes = res[2];
    } catch (e) { contenido.replaceChildren(err(e.message)); return; }
    const citas = r.citas.filter(function (c) { return c.estado !== 'cancelada'; });
    const porMarcar = pas.citas.concat(S.dia === P.hoy ? citas : []).filter(function (c) { return c.estado === 'confirmada' && c.inicioPasado; });
    const vis = mes.citas.filter(function (c) { return ['confirmada', 'asistio', 'no_asistio'].indexOf(c.estado) >= 0; });
    const as = vis.filter(function (c) { return c.estado === 'asistio'; }).length, na = vis.filter(function (c) { return c.estado === 'no_asistio'; }).length;
    const marcadas = as + na;

    /* filas de la línea de tiempo */
    const tiempos = {};
    bloquesDe(f).forEach(function (b) { for (let m = aMin(b[0]); m < aMin(b[1]); m += 60) tiempos[m] = 1; });
    citas.forEach(function (c) { tiempos[aMin(c.hora)] = 1; });
    r.bloqueos.forEach(function (b) { for (let m = (b.fechaIni < f ? 0 : aMin(b.horaIni)); m < 24 * 60 && cubre(b, f, m); m += 60) if (m >= aMin(P.apertura) && m < aMin(P.cierre) && Object.keys(tiempos).length) tiempos[m] = tiempos[m] || 2; });
    const orden = Object.keys(tiempos).map(Number).sort(function (a, b) { return a - b; });
    const filas = []; let ultimoBq = null;
    orden.forEach(function (m) {
      const c = citas.filter(function (x) { return aMin(x.hora) === m; })[0];
      const bq = r.bloqueos.filter(function (b) { return cubre(b, f, m); })[0];
      let cuerpoFila;
      if (c) { cuerpoFila = filaCita(c); ultimoBq = null; }
      else if (bq) {
        if (ultimoBq === bq.id) return;
        ultimoBq = bq.id;
        cuerpoFila = h('div', { class: 'tl-bq' }, h('span', null, (bq.diaCompleto ? 'Todo el día' : bq.horaIni + ' a ' + bq.horaFin) + ' · Bloqueado' + (bq.motivo ? ': ' + bq.motivo : '')),
          h('button', { type: 'button', class: 'tl-link', onclick: async function (ev) { ev.target.disabled = true; try { await llamar('agendaEliminarBloqueo', { bloqueoId: bq.id }); recargar(); } catch (e) { ev.target.disabled = false; } } }, 'Quitar'));
      } else { ultimoBq = null; cuerpoFila = h('div', { class: 'tl-libre' }, h('span', null, 'Libre'), h('button', { type: 'button', class: 'tl-link', onclick: function () { nuevaCita(f, hhmm(m)); } }, 'Agendar aquí')); }
      filas.push(h('div', { class: 'tl-fila' }, h('div', { class: 'tl-hora' }, hhmm(m)), cuerpoFila));
    });

    const lista = h('div', { class: 'tl' }, filas.length ? filas : [h('p', { class: 'vacio', style: 'padding:14px 0' }, 'No hay horario de atención ese día. Puedes cambiarlo en Mi horario.')]);
    const buscar = h('input', { id: 'buscar', type: 'search', class: 'busca', placeholder: 'Buscar cliente por nombre o celular', 'aria-label': 'Buscar cliente' });
    let todas = null;
    buscar.addEventListener('input', async function () {
      const t = buscar.value.trim().toLowerCase();
      if (t.length < 2) { lista.replaceChildren.apply(lista, filas.length ? filas : []); return; }
      if (!todas) {
        try {
          const a = await llamar('agendaCitas', { desde: sumar(P.hoy, -60), hasta: sumar(P.hoy, 0) }), b = await llamar('agendaCitas', { desde: sumar(P.hoy, 1), hasta: sumar(P.hoy, 61) });
          todas = a.citas.concat(b.citas);
        } catch (e) { return; }
      }
      const q2 = buscar.value.trim().toLowerCase();
      const res = todas.filter(function (c) { return c.estado !== 'cancelada' && (c.cliente.nombre + ' ' + c.cliente.telefono).toLowerCase().indexOf(q2) >= 0; }).slice(-30).reverse();

    const g = contenido.querySelector('.hgrid');
    const ajusta = function () {
      const rows = (parseInt(P.cierre, 10) || 22) - (parseInt(P.apertura, 10) || 6);
      const top = g.getBoundingClientRect().top + window.scrollY - window.scrollY;
      const hh = Math.max(16, Math.min(34, Math.floor((innerHeight - top - 28 - 76 - rows * 3) / rows)));
      g.style.setProperty('--hh', hh + 'px');
    };
    ajusta(); S.reajusta = ajusta;
  }

  /* ---------- Clientes ---------- */
  async function tabClientes() {
    cargando();
    let r; try { r = await llamar('agendaClientes'); } catch (e) { contenido.replaceChildren(err(e.message)); return; }
    const lista = h('div', { style: 'display:flex;flex-direction:column;gap:8px' });
    const buscar = h('input', { type: 'search', placeholder: 'Buscar por nombre o teléfono', 'aria-label': 'Buscar cliente' });
    function pintar() {
      const t = buscar.value.trim().toLowerCase();
      const fil = r.clientes.filter(function (c) { return !t || (c.nombre + ' ' + c.telefono).toLowerCase().indexOf(t) >= 0; });
      lista.replaceChildren.apply(lista, fil.length ? fil.map(function (c) {
        return h('div', { class: 'item' }, h('b', null, c.nombre), h('span', { class: 'meta' }, [c.telefono, c.correo].filter(Boolean).join(' · ')),
          h('span', { class: 'meta' }, c.citas + ' cita(s)' + (c.proxima ? ' · próxima ' + corta(c.proxima) : '') + (c.ultima ? ' · última ' + corta(c.ultima) : '')),
          c.telefono ? h('div', { class: 'acciones' }, h('a', { class: 'linkbtn', href: 'https://wa.me/52' + c.telefono, target: '_blank', rel: 'noopener noreferrer' }, 'WhatsApp')) : null);
      }) : [h('p', { class: 'vacio' }, 'Sin resultados.')]);
    }
    buscar.addEventListener('input', pintar);
    contenido.replaceChildren(h('h2', { class: 'sec-t' }, 'Mis clientes (' + r.clientes.length + ')'),
      h('p', { class: 'note' }, 'Solo ves a quienes han reservado contigo. Tus clientes no se comparten con otros profesionistas.'),
      h('div', { class: 'field' }, buscar), lista);
    pintar();
  }

  /* ---------- Cuenta ---------- */
  function tabCuenta() {
    const P = S.perfil;
    const texto = 'Reserva tu cita conmigo aquí: ' + P.linkReservas;
    const cp = h('button', { type: 'button', class: 'btn solid-ink', onclick: async function () { cp.textContent = (await copiar(P.linkReservas)) ? 'Link copiado' : 'Copia el link de arriba'; } }, 'Copiar mi link de reservas');
    const a = h('input', { id: 'pa', type: 'password', inputmode: 'numeric', maxlength: '6', autocomplete: 'current-password' });
    const n1 = h('input', { id: 'pn', type: 'password', inputmode: 'numeric', maxlength: '6', autocomplete: 'new-password' });
    const n2 = h('input', { id: 'pn2', type: 'password', inputmode: 'numeric', maxlength: '6', autocomplete: 'new-password' });
    const msg = h('div', { role: 'alert' });
    const btn = h('button', { type: 'button', class: 'btn light', onclick: async function () {
      msg.replaceChildren();
      if (!/^\d{6}$/.test(n1.value)) { msg.appendChild(err('El PIN nuevo debe tener 6 dígitos.')); return; }
      if (n1.value !== n2.value) { msg.appendChild(err('Los dos PIN nuevos no coinciden.')); return; }
      btn.disabled = true;
      try { await llamar('agendaCambiarPin', { pinActual: a.value, pinNuevo: n1.value }); guardar(''); login('PIN cambiado. Entra con tu PIN nuevo.'); }
      catch (e) { btn.disabled = false; msg.replaceChildren(err(e.message)); }
    } }, 'Cambiar PIN');
    const wa = h('input', { id: 'wa', type: 'tel', inputmode: 'numeric', value: P.whatsapp, maxlength: '14' });
    const ins = h('textarea', { id: 'ins', maxlength: '200', placeholder: 'Ej. Llega 5 minutos antes, toca el timbre del 2º piso.' }); ins.value = P.instrucciones || '';
    const msgD = h('div', { role: 'alert' });
    const btnD = h('button', { type: 'button', class: 'btn solid-ink', onclick: async function () {
      msgD.replaceChildren(); btnD.disabled = true; btnD.textContent = 'Guardando…';
      try {
        await llamar('agendaGuardarHorario', { whatsapp: wa.value, instrucciones: ins.value.trim() });
        P.whatsapp = wa.value.replace(/\D/g, '').slice(-10); P.instrucciones = ins.value.trim();
        msgD.replaceChildren(h('div', { class: 'ok' }, 'Guardado.'));
      } catch (e) { msgD.replaceChildren(err(e.message)); }
      btnD.disabled = false; btnD.textContent = 'Guardar';
    } }, 'Guardar');
    const datos = h('div', { class: 'panel' }, h('h2', { class: 'sec-t' }, 'Datos para tus clientes'),
      h('div', { class: 'field' }, h('label', { for: 'wa' }, 'Tu WhatsApp'), wa,
        h('span', { class: 'note' }, 'Lo ve el cliente cuando ya no puede cambiar o cancelar en línea, para que te escriba.')),
      h('div', { class: 'field' }, h('label', { for: 'ins' }, 'Mensaje para tus clientes'), ins,
        h('span', { class: 'note' }, 'Va en el correo de confirmación y en la página de su cita.')), msgD, btnD);
    contenido.replaceChildren(
      datos,
      h('h2', { class: 'sec-t' }, 'Mi link para clientes'),
      h('div', { class: 'linkbox' }, P.linkReservas), cp,
      h('a', { class: 'btn light', href: 'https://wa.me/?text=' + encodeURIComponent(texto), target: '_blank', rel: 'noopener noreferrer' }, 'Compartir por WhatsApp'),
      h('p', { class: 'note' }, 'Ponlo en tu WhatsApp Business, redes y tarjeta. Tus clientes reservan solos, sin cuenta.'),
      h('h2', { class: 'sec-t' }, 'Cambiar mi PIN'),
      h('div', { class: 'field' }, h('label', { for: 'pa' }, 'PIN actual'), a), h('div', { class: 'field' }, h('label', { for: 'pn' }, 'PIN nuevo'), n1), h('div', { class: 'field' }, h('label', { for: 'pn2' }, 'Repite el PIN nuevo'), n2), msg, btn,
      h('p', { class: 'note' }, 'Si lo olvidas, en la pantalla de acceso usa “Olvidé mi PIN”: te llega un link al correo ' + (P.correo || '') + '.'));
  }

  if (resetTok) vistaReset(); else if (S.sesion) iniciar(); else login();
})();
</script>
</body>
</html>
